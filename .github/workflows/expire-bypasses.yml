name: expire-bypasses
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          CONTROLD_API_TOKEN: ${{ secrets.CONTROLD_API_TOKEN }}
          CONTROLD_PROFILE_IDS: ${{ secrets.CONTROLD_PROFILE_IDS }}
          CONTROLD_PROFILE_ID: ${{ secrets.CONTROLD_PROFILE_ID }}
          AUTO_APPLY: "true"
          PYTHONPATH: scripts
        run: python3 scripts/expire_bypasses.py
